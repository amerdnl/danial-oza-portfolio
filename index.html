<!doctype html>
<html lang="en-MY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The English metadata below is what search engines and link previews see.
      When a visitor switches to Bahasa Melayu, the title, description, and
      <html lang> are updated at runtime by src/i18n/LanguageContext.jsx.
    -->
    <title>Danial Oza | Life Advisor and Takaful Consultation Malaysia</title>
    <meta
      name="description"
      content="Get personalised takaful guidance from Danial Oza, a registered AIA PUBLIC Takaful Life Advisor serving clients throughout Malaysia through physical and online consultations."
    />
    <meta name="author" content="Danial Oza" />
    <meta name="robots" content="index, follow" />
    <!--
      The site has one permanent light theme, so the browser UI and the page
      always match. No theme-selection script is needed before first paint.
    -->
    <meta name="theme-color" content="#FFF9F9" />
    <meta name="color-scheme" content="light" />

    <!--
      Critical pre-React shell. It paints before the module graph and global
      stylesheet load, then React replaces it with the animated intro.
    -->
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #fff9f9;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 999;
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        min-height: 100svh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        background: linear-gradient(135deg, #fff9f9 0%, #f8eded 45%, #f0d9d9 100%);
        color: #1a0000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .initial-loader__content {
        box-sizing: border-box;
        width: 100%;
        max-width: 28rem;
        padding: 0 1.5rem;
        text-align: center;
        animation: initial-loader-content-in 350ms ease-out both;
      }

      .initial-loader__brand {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.025em;
      }

      .initial-loader__title {
        margin: 0.5rem 0 0;
        color: #685b5b;
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .initial-loader__track {
        position: relative;
        height: 1px;
        margin-top: 2.25rem;
        overflow: hidden;
        border-radius: 9999px;
        background: rgba(61, 0, 0, 0.16);
      }

      .initial-loader__progress {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        background: #950101;
        box-shadow: 0 0 8px 0 rgba(149, 1, 1, 0.35);
        transform: scaleX(0);
        transform-origin: left center;
        animation: initial-loader-progress 2.8s linear forwards;
        will-change: transform;
      }

      @keyframes initial-loader-content-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /*
       * These points approximate an ease-out curve while keeping the elapsed
       * progress easy for React to continue without jumping backwards.
       */
      @keyframes initial-loader-progress {
        0% {
          transform: scaleX(0);
        }

        25% {
          transform: scaleX(0.4025);
        }

        50% {
          transform: scaleX(0.69);
        }

        75% {
          transform: scaleX(0.8625);
        }

        100% {
          transform: scaleX(0.92);
        }
      }

      @media (min-width: 640px) {
        .initial-loader__brand {
          font-size: 1.875rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-loader__content {
          animation: none;
        }

        .initial-loader__progress {
          animation-duration: 800ms;
          will-change: auto;
        }
      }
    </style>

      window.__DANIAL_LOADER_STARTED_AT__ = performance.now();
