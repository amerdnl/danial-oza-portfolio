<!doctype html>
<html lang="en-MY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The English metadata below is what search engines and link previews see.
      When a visitor switches to Bahasa Melayu, the title, description, and
      <html lang> are updated at runtime by src/i18n/LanguageContext.jsx.
    -->
    <title>Danial Oza | Life Advisor and Takaful Consultation Malaysia</title>
    <meta
      name="description"
      content="Get personalised takaful guidance from Danial Oza, a registered AIA PUBLIC Takaful Life Advisor serving clients throughout Malaysia through physical and online consultations."
    />
    <meta name="author" content="Danial Oza" />
    <meta name="robots" content="index, follow" />
    <!--
      The site has one permanent light theme, so the browser UI and the page
      always match. No theme-selection script is needed before first paint.
    -->
    <meta name="theme-color" content="#FFF9F9" />
    <meta name="color-scheme" content="light" />

    <!-- PLACEHOLDER — replace www.example.com with the live domain once deployed. -->
    <link rel="canonical" href="https://www.example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:locale" content="en_MY" />
    <meta property="og:locale:alternate" content="ms_MY" />
    <meta property="og:site_name" content="Danial Oza — Life Advisor" />
    <meta
      property="og:title"
      content="Danial Oza | Life Advisor and Takaful Consultation Malaysia"
    />
    <meta
      property="og:description"
      content="Personalised takaful guidance from a registered AIA PUBLIC Takaful Life Advisor. Free consultation, nationwide, physical or online."
    />
    <meta property="og:url" content="https://www.example.com/" />
    <!-- PLACEHOLDER — replace public/og-image.png with a real 1200x630 preview image. -->
    <meta property="og:image" content="https://www.example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Danial Oza, Life Advisor with AIA PUBLIC Takaful Berhad"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Danial Oza | Life Advisor and Takaful Consultation Malaysia"
    />
    <meta
      name="twitter:description"
      content="Personalised takaful guidance from a registered AIA PUBLIC Takaful Life Advisor. Free consultation, nationwide, physical or online."
    />
    <meta name="twitter:image" content="https://www.example.com/og-image.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/danial-oza.jpg" />

      included — there is no verified review data to support it.

          {
            "@type": "Person",

            "image": "https://www.example.com/images/danial-oza.jpg",
            "url": "https://www.example.com/",
            "email": "mailto:danial.7615y@aia-premier.com.my",
            "telephone": "+60199801317",
            "knowsLanguage": ["ms-MY", "en-MY"],
            "worksFor": {

              "https://www.tiktok.com/@danialoza"

          },
          {
            "@type": "ProfessionalService",
            "@id": "https://www.example.com/#service",

            "url": "https://www.example.com/",

            "image": "https://www.example.com/images/danial-oza.jpg",

                },
                {
                  "@type": "Offer",
                  "itemOffered": { "@type": "Service", "name": "Savings and Legacy Planning" }

  </head>
